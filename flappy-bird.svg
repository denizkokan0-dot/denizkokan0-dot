<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%">
<defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
.score-txt { font-size: 42px; text-anchor: middle; fill: #ffffff; stroke: #1b263b; stroke-width: 6; paint-order: stroke; stroke-linejoin: round; }
.sub-meta { font-size: 11px; font-family: "JetBrains Mono", Consolas, monospace; fill: #8b949e; letter-spacing: 0.5px; }
</style>

<!-- Sky gradient with continuous day/dusk/night cycle -->
<linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0">
  <animate attributeName="stop-color" dur="57.6s" repeatCount="indefinite"
    keyTimes="0;0.35;0.52;0.82;1"
    values="#4ec0ca;#e67e51;#0d163a;#e67e51;#4ec0ca" />
</stop>
<stop offset="1">
  <animate attributeName="stop-color" dur="57.6s" repeatCount="indefinite"
    keyTimes="0;0.35;0.52;0.82;1"
    values="#b5f0f5;#fed082;#233363;#fed082;#b5f0f5" />
</stop>
</linearGradient>

<!-- Pipe gradient for authentic 3D tube look -->
<linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#3d7515"/>
<stop offset="15%" stop-color="#73bf2e"/>
<stop offset="35%" stop-color="#9ee647"/>
<stop offset="70%" stop-color="#60b322"/>
<stop offset="100%" stop-color="#2a570c"/>
</linearGradient>

<!-- Ground sand gradient -->
<linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ded895"/>
<stop offset="25%" stop-color="#d4b46a"/>
<stop offset="100%" stop-color="#a47a32"/>
</linearGradient>

<clipPath id="cardClip"><rect width="880" height="300" rx="12"/></clipPath>
<clipPath id="scoreWindow"><rect x="360" y="10" width="160" height="52"/></clipPath>

<!-- Grass conveyor pattern -->
<pattern id="grassStripe" width="40" height="15" patternUnits="userSpaceOnUse">
<rect width="40" height="15" fill="#75cb2c"/>
<polygon points="0,15 15,0 30,0 15,15" fill="#58a818"/>
<line x1="0" y1="14" x2="40" y2="14" stroke="#377809" stroke-width="2"/>
</pattern>

<!-- Top Pipe Unit -->
<g id="pT">
  <rect x="0" y="-320" width="56" height="320" fill="url(#pipeGrad)" stroke="#1a3b05" stroke-width="2.5"/>
  <rect x="6" y="-320" width="6" height="320" fill="#ffffff" opacity="0.25"/>
  <rect x="-4" y="-28" width="64" height="28" rx="4" fill="url(#pipeGrad)" stroke="#1a3b05" stroke-width="2.5"/>
  <rect x="2" y="-28" width="6" height="28" fill="#ffffff" opacity="0.25"/>
</g>

<!-- Bottom Pipe Unit -->
<g id="pB">
  <rect x="0" y="0" width="56" height="320" fill="url(#pipeGrad)" stroke="#1a3b05" stroke-width="2.5"/>
  <rect x="6" y="0" width="6" height="320" fill="#ffffff" opacity="0.25"/>
  <rect x="-4" y="0" width="64" height="28" rx="4" fill="url(#pipeGrad)" stroke="#1a3b05" stroke-width="2.5"/>
  <rect x="2" y="0" width="6" height="28" fill="#ffffff" opacity="0.25"/>
</g>

<!-- Cloud template -->
<g id="cloud">
  <ellipse cx="0" cy="0" rx="28" ry="13"/>
  <ellipse cx="-20" cy="4" rx="18" ry="10"/>
  <ellipse cx="22" cy="4" rx="20" ry="10"/>
  <ellipse cx="6" cy="-8" rx="16" ry="11"/>
</g>

<!-- Mountain paths for parallax -->
<path id="mountA" d="M0 248V180Q110 130 220 180T440 180T660 180T880 180V248Z"/>
<path id="mountB" d="M0 248V210Q55 175 110 210T220 210T330 210T440 210T550 210T660 210T770 210T880 210V248Z"/>

</defs>

<g clip-path="url(#cardClip)">
<!-- Sky backdrop -->
<rect width="880" height="300" fill="url(#skyGrad)"/>

<!-- Twinkling stars (visible at night) -->
<g fill="#ffffff">
  <animate attributeName="opacity" dur="57.6s" repeatCount="indefinite"
    keyTimes="0;0.35;0.52;0.82;1"
    values="0;0.1;0.95;0.1;0"/>
  <circle cx="50" cy="35" r="1.5"/><circle cx="120" cy="70" r="1"/><circle cx="210" cy="25" r="1.4"/>
  <circle cx="310" cy="80" r="1"/><circle cx="410" cy="40" r="1.5"/><circle cx="530" cy="75" r="1.2"/>
  <circle cx="640" cy="30" r="1.5"/><circle cx="730" cy="65" r="1"/><circle cx="810" cy="45" r="1.4"/>
  <circle cx="770" cy="75" r="18" fill="#fef6cc"/>
  <circle cx="778" cy="70" r="15" fill="#0d163a">
    <animate attributeName="fill" dur="57.6s" repeatCount="indefinite"
      keyTimes="0;0.35;0.52;0.82;1"
      values="#4ec0ca;#e67e51;#0d163a;#e67e51;#4ec0ca" />
  </circle>
</g>

<!-- Slow drifting clouds -->
<g fill="#ffffff" opacity="0.82">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-880 0" dur="48s" repeatCount="indefinite"/>
  <use href="#cloud" x="100" y="65"/>
  <use href="#cloud" x="340" y="95" transform="translate(340 95) scale(0.8) translate(-340 -95)"/>
  <use href="#cloud" x="620" y="55"/>
  <use href="#cloud" x="800" y="110"/>
  <use href="#cloud" x="980" y="65"/>
  <use href="#cloud" x="1220" y="95" transform="translate(1220 95) scale(0.8) translate(-1220 -95)"/>
  <use href="#cloud" x="1500" y="55"/>
  <use href="#cloud" x="1680" y="110"/>
</g>

<!-- Parallax Distant Mountains -->
<g fill="#76b8c8" opacity="0.65">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-880 0" dur="64s" repeatCount="indefinite"/>
  <use href="#mountA"/><use href="#mountA" x="880"/>
</g>

<!-- Parallax Foreground Hills -->
<g fill="#53a65b">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-880 0" dur="32s" repeatCount="indefinite"/>
  <use href="#mountB"/><use href="#mountB" x="880"/>
</g>

<!-- Moving Pipes (Infinite scroll) -->
<g>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-8064 0" dur="57.6s" repeatCount="indefinite"/>
  <use href="#pT" x="212" y="81"/><use href="#pB" x="212" y="185"/><use href="#pT" x="436" y="89"/><use href="#pB" x="436" y="193"/><use href="#pT" x="660" y="96"/><use href="#pB" x="660" y="200"/><use href="#pT" x="884" y="88"/><use href="#pB" x="884" y="192"/><use href="#pT" x="1108" y="96"/><use href="#pB" x="1108" y="200"/><use href="#pT" x="1332" y="96"/><use href="#pB" x="1332" y="200"/><use href="#pT" x="1556" y="96"/><use href="#pB" x="1556" y="200"/><use href="#pT" x="1780" y="78"/><use href="#pB" x="1780" y="182"/><use href="#pT" x="2004" y="96"/><use href="#pB" x="2004" y="200"/><use href="#pT" x="2228" y="96"/><use href="#pB" x="2228" y="200"/><use href="#pT" x="2452" y="88"/><use href="#pB" x="2452" y="192"/><use href="#pT" x="2676" y="88"/><use href="#pB" x="2676" y="192"/><use href="#pT" x="2900" y="96"/><use href="#pB" x="2900" y="200"/><use href="#pT" x="3124" y="96"/><use href="#pB" x="3124" y="200"/><use href="#pT" x="3348" y="88"/><use href="#pB" x="3348" y="192"/><use href="#pT" x="3572" y="80"/><use href="#pB" x="3572" y="184"/><use href="#pT" x="3796" y="80"/><use href="#pB" x="3796" y="184"/><use href="#pT" x="4020" y="96"/><use href="#pB" x="4020" y="200"/><use href="#pT" x="4244" y="78"/><use href="#pB" x="4244" y="182"/><use href="#pT" x="4468" y="96"/><use href="#pB" x="4468" y="200"/><use href="#pT" x="4692" y="96"/><use href="#pB" x="4692" y="200"/><use href="#pT" x="4916" y="96"/><use href="#pB" x="4916" y="200"/><use href="#pT" x="5140" y="88"/><use href="#pB" x="5140" y="192"/><use href="#pT" x="5364" y="60"/><use href="#pB" x="5364" y="164"/><use href="#pT" x="5588" y="60"/><use href="#pB" x="5588" y="164"/><use href="#pT" x="5812" y="88"/><use href="#pB" x="5812" y="192"/><use href="#pT" x="6036" y="96"/><use href="#pB" x="6036" y="200"/><use href="#pT" x="6260" y="96"/><use href="#pB" x="6260" y="200"/><use href="#pT" x="6484" y="68"/><use href="#pB" x="6484" y="172"/><use href="#pT" x="6708" y="76"/><use href="#pB" x="6708" y="180"/><use href="#pT" x="6932" y="94"/><use href="#pB" x="6932" y="198"/><use href="#pT" x="7156" y="96"/><use href="#pB" x="7156" y="200"/><use href="#pT" x="7380" y="86"/><use href="#pB" x="7380" y="190"/><use href="#pT" x="7604" y="85"/><use href="#pB" x="7604" y="189"/><use href="#pT" x="7828" y="83"/><use href="#pB" x="7828" y="187"/><use href="#pT" x="8052" y="84"/><use href="#pB" x="8052" y="188"/><use href="#pT" x="8276" y="81"/><use href="#pB" x="8276" y="185"/><use href="#pT" x="8500" y="89"/><use href="#pB" x="8500" y="193"/><use href="#pT" x="8724" y="96"/><use href="#pB" x="8724" y="200"/><use href="#pT" x="8948" y="88"/><use href="#pB" x="8948" y="192"/><use href="#pT" x="9172" y="96"/><use href="#pB" x="9172" y="200"/>
</g>

<!-- Ground (Drawn above pipes to cover lower tube ends) -->
<g>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="0.2857s" repeatCount="indefinite"/>
  <rect x="0" y="248" width="960" height="15" fill="url(#grassStripe)"/>
  <rect x="0" y="263" width="960" height="37" fill="url(#groundGrad)"/>
  <line x1="0" y1="263" x2="960" y2="263" stroke="#916c28" stroke-width="2"/>
</g>

<!-- The Flappy Bird -->
<g transform="translate(240 0)">
  <!-- Vertical flight position -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="57.6s" repeatCount="indefinite"
      keyTimes="0;0.0097;0.0208;0.0228;0.0278;0.0375;0.0486;0.0506;0.0556;0.0653;0.0764;0.0783;0.0833;0.0931;0.1042;0.1061;0.1111;0.1208;0.1319;0.1339;0.1389;0.1486;0.1597;0.1617;0.1667;0.1764;0.1875;0.1894;0.1944;0.2042;0.2153;0.2172;0.2222;0.2319;0.2431;0.245;0.25;0.2597;0.2708;0.2728;0.2778;0.2875;0.2986;0.3006;0.3056;0.3153;0.3264;0.3283;0.3333;0.3431;0.3542;0.3561;0.3611;0.3708;0.3819;0.3839;0.3889;0.3986;0.4097;0.4117;0.4167;0.4264;0.4375;0.4394;0.4444;0.4542;0.4653;0.4672;0.4722;0.4819;0.4931;0.495;0.5;0.5097;0.5208;0.5228;0.5278;0.5375;0.5486;0.5506;0.5556;0.5653;0.5764;0.5783;0.5833;0.5931;0.6042;0.6061;0.6111;0.6208;0.6319;0.6339;0.6389;0.6486;0.6597;0.6617;0.6667;0.6764;0.6875;0.6894;0.6944;0.7042;0.7153;0.7172;0.7222;0.7319;0.7431;0.745;0.75;0.7597;0.7708;0.7728;0.7778;0.7875;0.7986;0.8006;0.8056;0.8153;0.8264;0.8283;0.8333;0.8431;0.8542;0.8561;0.8611;0.8708;0.8819;0.8839;0.8889;0.8986;0.9097;0.9117;0.9167;0.9264;0.9375;0.9394;0.9444;0.9542;0.9653;0.9672;0.9722;0.9819;0.9931;0.995;1" values="0 133;0 142;0 125;0 144;0 141;0 150;0 132.5;0 151;0 148;0 157;0 132;0 143;0 140;0 149;0 132;0 151;0 148;0 157;0 136;0 151;0 148;0 157;0 136;0 151;0 148;0 157;0 127;0 133;0 130;0 139;0 127;0 151;0 148;0 157;0 136;0 151;0 148;0 157;0 132;0 143;0 140;0 149;0 128;0 143;0 140;0 149;0 132;0 151;0 148;0 157;0 136;0 151;0 148;0 157;0 132;0 143;0 140;0 149;0 124;0 135;0 132;0 141;0 120;0 135;0 132;0 141;0 128;0 151;0 148;0 157;0 127;0 133;0 130;0 139;0 127;0 151;0 148;0 157;0 136;0 151;0 148;0 157;0 136;0 151;0 148;0 157;0 132;0 143;0 140;0 149;0 114;0 115;0 112;0 121;0 100;0 115;0 112;0 121;0 114;0 143;0 140;0 149;0 132;0 151;0 148;0 157;0 136;0 151;0 148;0 157;0 122;0 123;0 120;0 129;0 112;0 131;0 128;0 137;0 125;0 149;0 146;0 155;0 135;0 151;0 148;0 157;0 131;0 141;0 138;0 147;0 125.5;0 140;0 137;0 146;0 124;0 138;0 135;0 144;0 123.5;0 139;0 136;0 145;0 122.5;0 136;0 133"/>
    <!-- Pitch / Tilt rotation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="57.6s" repeatCount="indefinite"
        keyTimes="0;0.0097;0.0208;0.0228;0.0278;0.0375;0.0486;0.0506;0.0556;0.0653;0.0764;0.0783;0.0833;0.0931;0.1042;0.1061;0.1111;0.1208;0.1319;0.1339;0.1389;0.1486;0.1597;0.1617;0.1667;0.1764;0.1875;0.1894;0.1944;0.2042;0.2153;0.2172;0.2222;0.2319;0.2431;0.245;0.25;0.2597;0.2708;0.2728;0.2778;0.2875;0.2986;0.3006;0.3056;0.3153;0.3264;0.3283;0.3333;0.3431;0.3542;0.3561;0.3611;0.3708;0.3819;0.3839;0.3889;0.3986;0.4097;0.4117;0.4167;0.4264;0.4375;0.4394;0.4444;0.4542;0.4653;0.4672;0.4722;0.4819;0.4931;0.495;0.5;0.5097;0.5208;0.5228;0.5278;0.5375;0.5486;0.5506;0.5556;0.5653;0.5764;0.5783;0.5833;0.5931;0.6042;0.6061;0.6111;0.6208;0.6319;0.6339;0.6389;0.6486;0.6597;0.6617;0.6667;0.6764;0.6875;0.6894;0.6944;0.7042;0.7153;0.7172;0.7222;0.7319;0.7431;0.745;0.75;0.7597;0.7708;0.7728;0.7778;0.7875;0.7986;0.8006;0.8056;0.8153;0.8264;0.8283;0.8333;0.8431;0.8542;0.8561;0.8611;0.8708;0.8819;0.8839;0.8889;0.8986;0.9097;0.9117;0.9167;0.9264;0.9375;0.9394;0.9444;0.9542;0.9653;0.9672;0.9722;0.9819;0.9931;0.995;1" values="0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0;14;-18;8;0"/>

      <!-- Flappy Bird Graphics -->
      <!-- Tail feather -->
      <polygon points="-14,-2 -25,-6 -23,3" fill="#e5a823" stroke="#543818" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Main Body -->
      <ellipse cx="0" cy="0" rx="16" ry="13" fill="#f7d438" stroke="#543818" stroke-width="2.5"/>

      <!-- Belly / chest accent -->
      <ellipse cx="0" cy="5" rx="11" ry="5.5" fill="#fff7b8"/>

      <!-- Animated Flapping Wing -->
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="0.28s" repeatCount="indefinite"
          values="-24 -6 2; 24 -6 2; -24 -6 2"/>
        <ellipse cx="-5" cy="2" rx="9" ry="5.5" fill="#ffffff" stroke="#543818" stroke-width="2"/>
      </g>

      <!-- Eye -->
      <circle cx="7" cy="-5" r="5.5" fill="#ffffff" stroke="#543818" stroke-width="2"/>
      <circle cx="9" cy="-5" r="2.5" fill="#1b1b1b"/>
      <circle cx="10" cy="-6" r="0.9" fill="#ffffff"/>

      <!-- Beak (Classic 2-tone lips) -->
      <path d="M12,-1 Q25,-3 26,3 Q23,8 12,7 Z" fill="#f86422" stroke="#543818" stroke-width="2" stroke-linejoin="round"/>
      <line x1="13" y1="3" x2="25" y2="3" stroke="#543818" stroke-width="1.8"/>
    </g>
  </g>
</g>

<!-- Night shade overlay -->
<rect width="880" height="300" fill="#040924">
  <animate attributeName="opacity" dur="57.6s" repeatCount="indefinite"
    keyTimes="0;0.35;0.52;0.82;1"
    values="0;0.12;0.52;0.12;0"/>
</rect>

<!-- Score HUD Display -->
<g clip-path="url(#scoreWindow)">
  <g class="score-txt">
    <animateTransform attributeName="transform" type="translate" dur="57.6s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.0286;0.0564;0.0842;0.112;0.1398;0.1675;0.1953;0.2231;0.2509;0.2786;0.3064;0.3342;0.362;0.3898;0.4175;0.4453;0.4731;0.5009;0.5286;0.5564;0.5842;0.612;0.6398;0.6675;0.6953;0.7231;0.7509;0.7786;0.8064;0.8342;0.862;0.8898;0.9175;0.9453;0.9731" values="0 0;0 -50;0 -100;0 -150;0 -200;0 -250;0 -300;0 -350;0 -400;0 -450;0 -500;0 -550;0 -600;0 -650;0 -700;0 -750;0 -800;0 -850;0 -900;0 -950;0 -1000;0 -1050;0 -1100;0 -1150;0 -1200;0 -1250;0 -1300;0 -1350;0 -1400;0 -1450;0 -1500;0 -1550;0 -1600;0 -1650;0 -1700;0 -1750"/>
    <text x="440" y="48">1</text><text x="440" y="98">2</text><text x="440" y="148">3</text><text x="440" y="198">4</text><text x="440" y="248">5</text><text x="440" y="298">6</text><text x="440" y="348">7</text><text x="440" y="398">8</text><text x="440" y="448">9</text><text x="440" y="498">10</text><text x="440" y="548">11</text><text x="440" y="598">12</text><text x="440" y="648">13</text><text x="440" y="698">14</text><text x="440" y="748">15</text><text x="440" y="798">16</text><text x="440" y="848">17</text><text x="440" y="898">18</text><text x="440" y="948">19</text><text x="440" y="998">20</text><text x="440" y="1048">21</text><text x="440" y="1098">22</text><text x="440" y="1148">23</text><text x="440" y="1198">24</text><text x="440" y="1248">25</text><text x="440" y="1298">26</text><text x="440" y="1348">27</text><text x="440" y="1398">28</text><text x="440" y="1448">29</text><text x="440" y="1498">30</text><text x="440" y="1548">31</text><text x="440" y="1598">32</text><text x="440" y="1648">33</text><text x="440" y="1698">34</text><text x="440" y="1748">35</text><text x="440" y="1798">36</text>
  </g>
</g>

<!-- Profile badge & Interactive play pill -->
<text class="sub-meta" x="18" y="286" fill="#3c2f18">denizkokan0-dot · endless arcade</text>
<g>
  <rect x="768" y="14" width="98" height="28" rx="14" fill="#0d1117" opacity="0.82" stroke="#30363d" stroke-width="1"/>
  <text x="817" y="32" text-anchor="middle" style="font-size:11px;fill:#e6edf3;font-weight:600">▶ PLAY</text>
</g>

<!-- Card outline border -->
<rect x="1" y="1" width="878" height="298" rx="11" fill="none" stroke="#30363d" stroke-width="1.5"/>
</g>
</svg>