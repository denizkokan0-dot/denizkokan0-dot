<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131922"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2733"/>
      <stop offset="35%" stop-color="#2b3545"/>
      <stop offset="100%" stop-color="#181f29"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="viewport">
      <rect x="1" y="1" width="878" height="298" rx="10"/>
    </clipPath>
    <clipPath id="gameArea">
      <rect x="1" y="42" width="878" height="226"/>
    </clipPath>

    <!-- Subtle background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b222d" stroke-width="0.75"/>
    </pattern>

    <!-- Pillar Set 1: Gap Center y=148 (gap 98..198) -->
    <g id="colA">
      <rect x="0" y="40" width="44" height="58" fill="url(#pillarGrad)" stroke="#30363d" stroke-width="1"/>
      <rect x="-3" y="92" width="50" height="6" rx="1.5" fill="#2d3748" stroke="#3d4758" stroke-width="1"/>
      <rect x="0" y="198" width="44" height="72" fill="url(#pillarGrad)" stroke="#30363d" stroke-width="1"/>
      <rect x="-3" y="198" width="50" height="6" rx="1.5" fill="#2d3748" stroke="#3d4758" stroke-width="1"/>
      <line x1="22" y1="98" x2="22" y2="198" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>
    </g>

    <!-- Pillar Set 2: Gap Center y=118 (gap 68..168) -->
    <g id="colB">
      <rect x="0" y="40" width="44" height="28" fill="url(#pillarGrad)" stroke="#30363d" stroke-width="1"/>
      <rect x="-3" y="62" width="50" height="6" rx="1.5" fill="#2d3748" stroke="#3d4758" stroke-width="1"/>
      <rect x="0" y="168" width="44" height="102" fill="url(#pillarGrad)" stroke="#30363d" stroke-width="1"/>
      <rect x="-3" y="168" width="50" height="6" rx="1.5" fill="#2d3748" stroke="#3d4758" stroke-width="1"/>
      <line x1="22" y1="68" x2="22" y2="168" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>
    </g>

    <!-- Pillar Set 3: Gap Center y=172 (gap 122..222) -->
    <g id="colC">
      <rect x="0" y="40" width="44" height="82" fill="url(#pillarGrad)" stroke="#30363d" stroke-width="1"/>
      <rect x="-3" y="116" width="50" height="6" rx="1.5" fill="#2d3748" stroke="#3d4758" stroke-width="1"/>
      <rect x="0" y="222" width="44" height="48" fill="url(#pillarGrad)" stroke="#30363d" stroke-width="1"/>
      <rect x="-3" y="222" width="50" height="6" rx="1.5" fill="#2d3748" stroke="#3d4758" stroke-width="1"/>
      <line x1="22" y1="122" x2="22" y2="222" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>
    </g>

    <!-- Pillar Set 4: Gap Center y=136 (gap 86..186) -->
    <g id="colD">
      <rect x="0" y="40" width="44" height="46" fill="url(#pillarGrad)" stroke="#30363d" stroke-width="1"/>
      <rect x="-3" y="80" width="50" height="6" rx="1.5" fill="#2d3748" stroke="#3d4758" stroke-width="1"/>
      <rect x="0" y="186" width="44" height="84" fill="url(#pillarGrad)" stroke="#30363d" stroke-width="1"/>
      <rect x="-3" y="186" width="50" height="6" rx="1.5" fill="#2d3748" stroke="#3d4758" stroke-width="1"/>
      <line x1="22" y1="86" x2="22" y2="186" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>
    </g>

    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }
      .world-scroll {
        animation: scrollWorld 8s linear infinite;
      }
      .parallax-scroll {
        animation: scrollParallax 16s linear infinite;
      }
      .bird-motion {
        animation: birdPath 8s cubic-bezier(0.42, 0, 0.58, 1) infinite;
        transform-origin: 210px 148px;
      }
      .wing-anim {
        animation: wingCycle 0.28s ease-in-out infinite alternate;
        transform-origin: 206px 149px;
      }
      .s0 { animation: tick0 8s steps(1) infinite; }
      .s1 { animation: tick1 8s steps(1) infinite; }
      .s2 { animation: tick2 8s steps(1) infinite; }
      .s3 { animation: tick3 8s steps(1) infinite; }

      @keyframes scrollWorld {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(-880px); }
      }
      @keyframes scrollParallax {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(-440px); }
      }
      /* 4 pillars spaced every 220px (220, 440, 660, 880) over 880px period.
         Bird is at x=210.
         Pillar 1 (220 -> 210) at t = 1.2%  (gap y=148)
         Pillar 2 (440 -> 210) at t = 26.1% (gap y=118, offset -30)
         Pillar 3 (660 -> 210) at t = 51.1% (gap y=172, offset +24)
         Pillar 4 (880 -> 210) at t = 76.1% (gap y=136, offset -12) */
      @keyframes birdPath {
        0%   { transform: translateY(0px) rotate(-6deg); }
        10%  { transform: translateY(8px) rotate(10deg); }
        18%  { transform: translateY(-22px) rotate(-14deg); }
        26%  { transform: translateY(-30px) rotate(-4deg); }
        38%  { transform: translateY(14px) rotate(14deg); }
        46%  { transform: translateY(26px) rotate(-10deg); }
        52%  { transform: translateY(22px) rotate(4deg); }
        64%  { transform: translateY(4px) rotate(-12deg); }
        76%  { transform: translateY(-12px) rotate(-4deg); }
        88%  { transform: translateY(10px) rotate(10deg); }
        95%  { transform: translateY(-2px) rotate(-10deg); }
        100% { transform: translateY(0px) rotate(-6deg); }
      }
      @keyframes wingCycle {
        0%   { transform: rotate(-18deg); }
        100% { transform: rotate(16deg); }
      }
      @keyframes tick0 {
        0%, 100% { opacity: 1; }
        26%, 99.9% { opacity: 0; }
      }
      @keyframes tick1 {
        0%, 25.9%, 51%, 100% { opacity: 0; }
        26%, 50.9% { opacity: 1; }
      }
      @keyframes tick2 {
        0%, 50.9%, 76%, 100% { opacity: 0; }
        51%, 75.9% { opacity: 1; }
      }
      @keyframes tick3 {
        0%, 75.9% { opacity: 0; }
        76%, 99.9% { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#viewport)">
    <!-- Base Canvas -->
    <rect width="880" height="300" fill="url(#bgGrad)"/>

    <!-- Game Viewport Area -->
    <g clip-path="url(#gameArea)">
      <!-- Subtle Architectural Grid -->
      <rect x="0" y="42" width="880" height="226" fill="url(#grid)" opacity="0.7"/>

      <!-- Horizon Line & Minimal Parallax Geometry -->
      <line x1="0" y1="215" x2="880" y2="215" stroke="#1b222d" stroke-width="1"/>
      <g class="parallax-scroll" stroke="#1f2733" stroke-width="1" fill="#11161f">
        <rect x="40" y="185" width="60" height="83"/>
        <rect x="130" y="165" width="45" height="103"/>
        <rect x="240" y="192" width="75" height="76"/>
        <rect x="360" y="172" width="50" height="96"/>
        <rect x="480" y="185" width="60" height="83"/>
        <rect x="570" y="165" width="45" height="103"/>
        <rect x="680" y="192" width="75" height="76"/>
        <rect x="800" y="172" width="50" height="96"/>
        <rect x="920" y="185" width="60" height="83"/>
        <rect x="1010" y="165" width="45" height="103"/>
        <rect x="1120" y="192" width="75" height="76"/>
        <rect x="1240" y="172" width="50" height="96"/>
      </g>

      <!-- Trajectory Guide Curve (subtle) -->
      <path d="M 120 156 Q 170 150, 210 148" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="2 4"/>

      <!-- Scrolling Pillars (880px cycle) -->
      <g class="world-scroll">
        <use href="#colA" x="220" y="0"/>
        <use href="#colB" x="440" y="0"/>
        <use href="#colC" x="660" y="0"/>
        <use href="#colD" x="880" y="0"/>

        <use href="#colA" x="1100" y="0"/>
        <use href="#colB" x="1320" y="0"/>
        <use href="#colC" x="1540" y="0"/>
        <use href="#colD" x="1760" y="0"/>
      </g>

      <!-- Minimalist Bird / Glider -->
      <g class="bird-motion">
        <!-- Subtle wake nodes -->
        <circle cx="176" cy="150" r="1.5" fill="#484f58"/>
        <circle cx="188" cy="149" r="2" fill="#6e7681"/>

        <!-- Body (clean geometric capsule/bird) -->
        <rect x="196" y="140" width="26" height="16" rx="8" fill="#e6edf3" stroke="#0d1117" stroke-width="1.5"/>
        <!-- Wing -->
        <g class="wing-anim">
          <rect x="200" y="146" width="11" height="6" rx="3" fill="#8b949e"/>
        </g>
        <!-- Eye -->
        <circle cx="215" cy="146" r="1.8" fill="#0d1117"/>
        <!-- Beak accent -->
        <polygon points="222,145 228,148 222,151" fill="#d29922"/>
      </g>

      <!-- Edge Vignettes -->
      <rect x="0" y="42" width="48" height="226" fill="url(#fadeLeft)"/>
      <rect x="832" y="42" width="48" height="226" fill="url(#fadeRight)"/>
    </g>

    <!-- Top Header Bar -->
    <rect x="0" y="0" width="880" height="42" fill="#0d1117"/>
    <line x1="0" y1="42" x2="880" y2="42" stroke="#21262d" stroke-width="1"/>

    <!-- Window Controls (Subtle Monochrome) -->
    <circle cx="22" cy="21" r="4.5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="36" cy="21" r="4.5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="50" cy="21" r="4.5" fill="#21262d" stroke="#30363d" stroke-width="1"/>

    <!-- Title / Repo Path -->
    <text x="70" y="25" class="mono" font-size="12" fill="#7d8590">denizkokan0-dot <tspan fill="#484f58">/</tspan> <tspan fill="#e6edf3" font-weight="600">flappy</tspan></text>

    <!-- Center Live Telemetry -->
    <g transform="translate(440, 25)" text-anchor="middle" class="mono" font-size="11.5">
      <text x="-55" y="0" fill="#7d8590">SCORE</text>
      <text x="-18" y="0" fill="#e6edf3" font-weight="600" class="s0">14</text>
      <text x="-18" y="0" fill="#e6edf3" font-weight="600" class="s1">15</text>
      <text x="-18" y="0" fill="#e6edf3" font-weight="600" class="s2">16</text>
      <text x="-18" y="0" fill="#e6edf3" font-weight="600" class="s3">17</text>
      <text x="8" y="0" fill="#30363d">|</text>
      <text x="52" y="0" fill="#7d8590">BEST <tspan fill="#8b949e">42</tspan></text>
    </g>

    <!-- Right Action Button (Minimal Pill) -->
    <rect x="742" y="10" width="122" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="755" cy="21" r="3" fill="#3fb950"/>
    <text x="810" y="25" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#c9d1d9">Launch Game ↗</text>

    <!-- Bottom Status Bar -->
    <rect x="0" y="268" width="880" height="32" fill="#0d1117"/>
    <line x1="0" y1="268" x2="880" y2="268" stroke="#21262d" stroke-width="1"/>

    <text x="20" y="288" class="mono" font-size="11" fill="#7d8590">
      INPUT <tspan fill="#c9d1d9">[SPACE]</tspan> OR <tspan fill="#c9d1d9">[CLICK]</tspan>
    </text>
    <text x="860" y="288" text-anchor="end" class="mono" font-size="11" fill="#7d8590">
      60 FPS · PHYSICS SIM · CLICK CANVAS TO PLAY
    </text>

    <!-- Outer Hairline Border -->
    <rect x="0.5" y="0.5" width="879" height="299" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
  </g>
</svg>
