<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="28%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="18%" stop-color="#4d7c0f"/>
      <stop offset="19%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="0" y="0" width="840" height="320" rx="16"/>
    </clipPath>

    <!-- Reusable Pipe Pair (gap center around y=145) -->
    <g id="pipePairA">
      <!-- Top Pipe -->
      <rect x="0" y="-10" width="52" height="95" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
      <rect x="-4" y="75" width="60" height="22" rx="3" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
      <!-- Bottom Pipe -->
      <rect x="0" y="195" width="52" height="110" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
      <rect x="-4" y="185" width="60" height="22" rx="3" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
    </g>

    <g id="pipePairB">
      <!-- Top Pipe -->
      <rect x="0" y="-10" width="52" height="60" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
      <rect x="-4" y="40" width="60" height="22" rx="3" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
      <!-- Bottom Pipe -->
      <rect x="0" y="160" width="52" height="145" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
      <rect x="-4" y="150" width="60" height="22" rx="3" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
    </g>

    <g id="pipePairC">
      <!-- Top Pipe -->
      <rect x="0" y="-10" width="52" height="125" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
      <rect x="-4" y="105" width="60" height="22" rx="3" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
      <!-- Bottom Pipe -->
      <rect x="0" y="220" width="52" height="85" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
      <rect x="-4" y="210" width="60" height="22" rx="3" fill="url(#pipeGrad)" stroke="#052e16" stroke-width="2.5"/>
    </g>

    <style>
      .pipes-scroll {
        animation: scrollPipes 6s linear infinite;
      }
      .clouds-scroll {
        animation: scrollClouds 18s linear infinite;
      }
      .ground-scroll {
        animation: scrollGround 1.5s linear infinite;
      }
      .bird-flight {
        animation: flyBird 6s ease-in-out infinite;
        transform-origin: 200px 140px;
      }
      .wing-flap {
        animation: flapWing 0.22s ease-in-out infinite alternate;
        transform-origin: 194px 142px;
      }
      .cta-pulse {
        animation: pulseBtn 1.2s ease-in-out infinite alternate;
        transform-origin: 705px 40px;
      }
      .star-blink {
        animation: blink 2s ease-in-out infinite alternate;
      }
      .score-0 { animation: scoreStep0 6s steps(1) infinite; }
      .score-1 { animation: scoreStep1 6s steps(1) infinite; }
      .score-2 { animation: scoreStep2 6s steps(1) infinite; }
      .score-3 { animation: scoreStep3 6s steps(1) infinite; }

      @keyframes scrollPipes {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-840px); }
      }
      @keyframes scrollClouds {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-840px); }
      }
      @keyframes scrollGround {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-120px); }
      }
      /* Pipes are spaced every 280px: at x=320, 600, 880 (which wraps with -840px period)
         Wait: 840 / 3 = 280px! Let's place pipes at 280, 560, 840 (+ 1120, 1400, 1680) */
      @keyframes flyBird {
        0%   { transform: translateY(0px) rotate(-10deg); }
        8%   { transform: translateY(-6px) rotate(-14deg); }
        18%  { transform: translateY(15px) rotate(12deg); }
        26%  { transform: translateY(-28px) rotate(-18deg); }
        36%  { transform: translateY(-38px) rotate(-8deg); }
        46%  { transform: translateY(5px) rotate(16deg); }
        56%  { transform: translateY(-8px) rotate(-15deg); }
        68%  { transform: translateY(24px) rotate(10deg); }
        78%  { transform: translateY(12px) rotate(-16deg); }
        88%  { transform: translateY(28px) rotate(8deg); }
        95%  { transform: translateY(-5px) rotate(-15deg); }
        100% { transform: translateY(0px) rotate(-10deg); }
      }
      @keyframes flapWing {
        0%   { transform: rotate(-22deg) translateY(-2px); }
        100% { transform: rotate(24deg) translateY(3px); }
      }
      @keyframes pulseBtn {
        0%   { transform: scale(0.97); }
        100% { transform: scale(1.04); }
      }
      @keyframes blink {
        0%   { opacity: 0.25; }
        100% { opacity: 0.95; }
      }
      @keyframes scoreStep0 {
        0%, 100% { opacity: 1; }
        16%, 99.9% { opacity: 0; }
      }
      @keyframes scoreStep1 {
        0%, 15.9%, 50%, 100% { opacity: 0; }
        16%, 49.9% { opacity: 1; }
      }
      @keyframes scoreStep2 {
        0%, 49.9%, 83%, 100% { opacity: 0; }
        50%, 82.9% { opacity: 1; }
      }
      @keyframes scoreStep3 {
        0%, 82.9% { opacity: 0; }
        83%, 99.9% { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#screenClip)">
    <!-- Sky Background -->
    <rect width="840" height="320" fill="url(#sky)"/>

    <!-- Stars -->
    <g fill="#f8fafc" class="star-blink">
      <circle cx="70" cy="40" r="1.5"/>
      <circle cx="165" cy="70" r="1.2"/>
      <circle cx="290" cy="30" r="1.8"/>
      <circle cx="440" cy="55" r="1.4"/>
      <circle cx="560" cy="28" r="1.6"/>
      <circle cx="670" cy="68" r="1.2"/>
      <circle cx="785" cy="42" r="1.7"/>
    </g>

    <!-- Distant City Silhouette -->
    <g fill="#0f172a" opacity="0.35">
      <rect x="0" y="210" width="45" height="75"/>
      <rect x="40" y="190" width="35" height="95"/>
      <rect x="75" y="220" width="50" height="65"/>
      <rect x="125" y="175" width="40" height="110"/>
      <rect x="165" y="205" width="55" height="80"/>
      <rect x="220" y="195" width="38" height="90"/>
      <rect x="258" y="215" width="60" height="70"/>
      <rect x="318" y="180" width="42" height="105"/>
      <rect x="360" y="200" width="50" height="85"/>
      <rect x="410" y="185" width="45" height="100"/>
      <rect x="455" y="210" width="55" height="75"/>
      <rect x="510" y="170" width="38" height="115"/>
      <rect x="548" y="198" width="52" height="87"/>
      <rect x="600" y="212" width="48" height="73"/>
      <rect x="648" y="182" width="44" height="103"/>
      <rect x="692" y="204" width="58" height="81"/>
      <rect x="750" y="188" width="42" height="97"/>
      <rect x="792" y="208" width="48" height="77"/>
    </g>

    <!-- Scrolling Clouds (840px repeat) -->
    <g class="clouds-scroll" fill="#e0f2fe" opacity="0.28">
      <g>
        <rect x="80" y="75" width="70" height="18" rx="9"/>
        <rect x="95" y="65" width="40" height="16" rx="8"/>
        <rect x="350" y="50" width="90" height="20" rx="10"/>
        <rect x="370" y="38" width="50" height="18" rx="9"/>
        <rect x="640" y="82" width="76" height="18" rx="9"/>
        <rect x="656" y="70" width="44" height="16" rx="8"/>
      </g>
      <g transform="translate(840, 0)">
        <rect x="80" y="75" width="70" height="18" rx="9"/>
        <rect x="95" y="65" width="40" height="16" rx="8"/>
        <rect x="350" y="50" width="90" height="20" rx="10"/>
        <rect x="370" y="38" width="50" height="18" rx="9"/>
        <rect x="640" y="82" width="76" height="18" rx="9"/>
        <rect x="656" y="70" width="44" height="16" rx="8"/>
      </g>
    </g>

    <!-- Scrolling Pipes (3 pipes per 840px cycle: spaced 280px apart) -->
    <g class="pipes-scroll">
      <!-- First 840px set -->
      <use href="#pipePairA" x="280" y="0"/>
      <use href="#pipePairB" x="560" y="0"/>
      <use href="#pipePairC" x="840" y="0"/>
      <!-- Duplicate 840px set for seamless loop -->
      <use href="#pipePairA" x="1120" y="0"/>
      <use href="#pipePairB" x="1400" y="0"/>
      <use href="#pipePairC" x="1680" y="0"/>
    </g>

    <!-- Animated Bird (around x=200, y=140) -->
    <g class="bird-flight">
      <!-- Glow / Trail -->
      <ellipse cx="185" cy="142" rx="22" ry="14" fill="#facc15" opacity="0.22"/>
      <!-- Bird Body -->
      <ellipse cx="200" cy="140" rx="17" ry="13" fill="#facc15" stroke="#1e293b" stroke-width="2.5"/>
      <!-- Belly highlight -->
      <path d="M 188 145 Q 200 153 212 145" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <!-- Eye -->
      <circle cx="207" cy="135" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
      <circle cx="209" cy="135" r="2.2" fill="#0f172a"/>
      <!-- Beak -->
      <polygon points="215,138 227,142 215,146" fill="#f97316" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
      <!-- Flapping Wing -->
      <g class="wing-flap">
        <ellipse cx="194" cy="142" rx="8" ry="5.5" fill="#fef08a" stroke="#1e293b" stroke-width="2"/>
      </g>
    </g>

    <!-- Ground Base -->
    <rect x="0" y="280" width="840" height="40" fill="url(#groundGrad)"/>
    <line x1="0" y1="280" x2="840" y2="280" stroke="#052e16" stroke-width="3"/>

    <!-- Scrolling Ground Stripes -->
    <g class="ground-scroll" fill="#65a30d" opacity="0.55">
      <polygon points="0,282 15,282 5,290 -10,290"/>
      <polygon points="30,282 45,282 35,290 20,290"/>
      <polygon points="60,282 75,282 65,290 50,290"/>
      <polygon points="90,282 105,282 95,290 80,290"/>
      <polygon points="120,282 135,282 125,290 110,290"/>
      <polygon points="150,282 165,282 155,290 140,290"/>
      <polygon points="180,282 195,282 185,290 170,290"/>
      <polygon points="210,282 225,282 215,290 200,290"/>
      <polygon points="240,282 255,282 245,290 230,290"/>
      <polygon points="270,282 285,282 275,290 260,290"/>
      <polygon points="300,282 315,282 305,290 290,290"/>
      <polygon points="330,282 345,282 335,290 320,290"/>
      <polygon points="360,282 375,282 365,290 350,290"/>
      <polygon points="390,282 405,282 395,290 380,290"/>
      <polygon points="420,282 435,282 425,290 410,290"/>
      <polygon points="450,282 465,282 455,290 440,290"/>
      <polygon points="480,282 495,282 485,290 470,290"/>
      <polygon points="510,282 525,282 515,290 500,290"/>
      <polygon points="540,282 555,282 545,290 530,290"/>
      <polygon points="570,282 585,282 575,290 560,290"/>
      <polygon points="600,282 615,282 605,290 590,290"/>
      <polygon points="630,282 645,282 635,290 620,290"/>
      <polygon points="660,282 675,282 665,290 650,290"/>
      <polygon points="690,282 705,282 695,290 680,290"/>
      <polygon points="720,282 735,282 725,290 710,290"/>
      <polygon points="750,282 765,282 755,290 740,290"/>
      <polygon points="780,282 795,282 785,290 770,290"/>
      <polygon points="810,282 825,282 815,290 800,290"/>
      <polygon points="840,282 855,282 845,290 830,290"/>
      <polygon points="870,282 885,282 875,290 860,290"/>
      <polygon points="900,282 915,282 905,290 890,290"/>
      <polygon points="930,282 945,282 935,290 920,290"/>
    </g>

    <!-- HUD Top-Left: Player Badge -->
    <rect x="18" y="16" width="250" height="46" rx="10" fill="#0f172a" opacity="0.82" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="42" cy="39" r="11" fill="#facc15"/>
    <text x="62" y="35" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#f8fafc">denizkokan0-dot</text>
    <text x="62" y="51" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#38bdf8">FLAPPY BIRD ARCADE v1.0</text>

    <!-- HUD Center: Animated Live Score -->
    <rect x="375" y="14" width="90" height="48" rx="12" fill="#0f172a" opacity="0.75" stroke="#facc15" stroke-width="2"/>
    <text x="420" y="30" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="bold" fill="#94a3b8">SKOR</text>
    <text x="420" y="53" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="bold" fill="#facc15" class="score-0">07</text>
    <text x="420" y="53" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="bold" fill="#facc15" class="score-1">08</text>
    <text x="420" y="53" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="bold" fill="#facc15" class="score-2">09</text>
    <text x="420" y="53" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="bold" fill="#facc15" class="score-3">10</text>

    <!-- HUD Top-Right: Click to Play CTA Button -->
    <g class="cta-pulse">
      <rect x="590" y="16" width="232" height="46" rx="23" fill="url(#btnGrad)" stroke="#fef08a" stroke-width="2"/>
      <text x="706" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">▶ TIKLA VE OYNA (PLAY)</text>
    </g>

    <!-- Bottom Arcade Bar Text -->
    <text x="420" y="305" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#fef08a" letter-spacing="1">
      [ SPACE / MOUSE CLICK ] BORULARA ÇARPMADAN UÇ! OYNAMAK İÇİN EKRANA TIKLA
    </text>

    <!-- Arcade Screen Frame Border -->
    <rect x="1.5" y="1.5" width="837" height="317" rx="15" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.65"/>
  </g>
</svg>
