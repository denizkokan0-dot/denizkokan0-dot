<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird Arcade — @denizkokan0-dot</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --accent: #38bdf8;
      --gold: #facc15;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at top, #1e293b 0%, #090d16 75%);
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }
    .arcade-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 460px;
      width: 100%;
    }
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 10px 16px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
    }
    .profile-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }
    .profile-link:hover {
      color: var(--gold);
    }
    .score-pills {
      display: flex;
      gap: 10px;
      font-family: Consolas, monospace;
      font-size: 0.9rem;
    }
    .pill {
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(250, 204, 21, 0.35);
      color: var(--gold);
      font-weight: bold;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 420 / 580;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.2), 0 15px 40px rgba(0,0,0,0.65);
      background: #0f172a;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
      touch-action: manipulation;
    }
    .controls-hint {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      font-family: Consolas, monospace;
    }
    .controls-hint kbd {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 5px;
      padding: 2px 7px;
      color: #f8fafc;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="arcade-wrapper">
    <div class="header-bar">
      <a class="profile-link" href="https://github.com/denizkokan0-dot" target="_top">
        <span>🐦 @denizkokan0-dot</span>
      </a>
      <div class="score-pills">
        <div class="pill">SKOR: <span id="scoreVal">0</span></div>
        <div class="pill">REKOR: <span id="bestVal">0</span></div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="420" height="580"></canvas>
    </div>

    <div class="controls-hint">
      Zıplamak için <kbd>SPACE</kbd>, <kbd>↑</kbd> veya <kbd>Ekrana Tıkla / Dokun</kbd>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreVal');
    const bestEl = document.getElementById('bestVal');

    const W = canvas.width;
    const H = canvas.height;
    const GROUND_H = 70;

    // Web Audio API Retro Sound Synth
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'flap') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(580, now + 0.09);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'score') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.setValueAtTime(780, now + 0.07);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.28);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        }
      } catch (e) {}
    }

    let state = 'START'; // START, PLAY, OVER
    let frames = 0;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('deniz_flappy_best') || '0', 10);
    bestEl.textContent = bestScore;

    const bird = {
      x: 95,
      y: H / 2 - 30,
      vy: 0,
      gravity: 0.38,
      jump: -7.2,
      radius: 15,
      rotation: 0,
      reset() {
        this.y = H / 2 - 30;
        this.vy = 0;
        this.rotation = 0;
      },
      flap() {
        this.vy = this.jump;
        playSound('flap');
        spawnParticles(this.x - 10, this.y + 5, '#fef08a', 6);
      },
      update() {
        if (state === 'START') {
          this.y = H / 2 - 30 + Math.sin(frames * 0.08) * 9;
          this.rotation = 0;
          return;
        }
        this.vy += this.gravity;
        this.y += this.vy;

        if (this.vy < 0) {
          this.rotation = Math.max(-0.45, this.vy * 0.06);
        } else {
          this.rotation = Math.min(Math.PI / 2.2, this.vy * 0.07);
        }

        // Floor collision
        if (this.y + this.radius >= H - GROUND_H) {
          this.y = H - GROUND_H - this.radius;
          if (state === 'PLAY') triggerGameOver();
        }
        // Ceiling clamp
        if (this.y - this.radius < 0) {
          this.y = this.radius;
          this.vy = 0;
        }
      },
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Glow
        ctx.fillStyle = 'rgba(250, 204, 21, 0.2)';
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();

        // Body
        ctx.fillStyle = '#facc15';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Wing
        const wingOffset = state === 'OVER' ? 0 : Math.sin(frames * 0.35) * 4;
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.ellipse(-5, 2 + wingOffset, 8, 5, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eye
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(7, -4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(8.5, -4, 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(14, -2);
        ctx.lineTo(25, 2);
        ctx.lineTo(14, 6);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }
    };

    const pipes = [];
    const PIPE_W = 58;
    const PIPE_GAP = 132;
    const PIPE_SPEED = 2.65;

    function resetGame() {
      pipes.length = 0;
      particles.length = 0;
      score = 0;
      scoreEl.textContent = '0';
      bird.reset();
      state = 'PLAY';
      bird.flap();
    }

    function triggerGameOver() {
      state = 'OVER';
      playSound('hit');
      spawnParticles(bird.x, bird.y, '#ef4444', 18);
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('deniz_flappy_best', String(bestScore));
        bestEl.textContent = bestScore;
      }
    }

    const particles = [];
    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 1,
          color
        });
      }
    }

    const stars = Array.from({ length: 28 }, () => ({
      x: Math.random() * W,
      y: Math.random() * (H - GROUND_H - 120),
      r: Math.random() * 1.6 + 0.6,
      phase: Math.random() * Math.PI * 2
    }));

    function updatePipes() {
      if (state !== 'PLAY') return;

      if (frames % 92 === 0) {
        const minTop = 55;
        const maxTop = H - GROUND_H - PIPE_GAP - 65;
        const topH = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
        pipes.push({ x: W + 10, topH, passed: false });
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPEED;

        // Collision check
        const withinX = bird.x + bird.radius - 3 > p.x && bird.x - bird.radius + 3 < p.x + PIPE_W;
        const hitTop = bird.y - bird.radius + 3 < p.topH;
        const hitBottom = bird.y + bird.radius - 3 > p.topH + PIPE_GAP;

        if (withinX && (hitTop || hitBottom)) {
          triggerGameOver();
        }

        // Score check
        if (!p.passed && p.x + PIPE_W < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          playSound('score');
          spawnParticles(bird.x, bird.y - 20, '#4ade80', 10);
        }

        if (p.x + PIPE_W < -20) {
          pipes.splice(i, 1);
        }
      }
    }

    function drawPipe(x, y, w, h, isTop) {
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#16a34a');
      grad.addColorStop(0.3, '#4ade80');
      grad.addColorStop(0.65, '#22c55e');
      grad.addColorStop(1, '#14532d');

      ctx.fillStyle = grad;
      ctx.strokeStyle = '#052e16';
      ctx.lineWidth = 2.5;
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);

      // Pipe lip
      const lipH = 22;
      const lipY = isTop ? y + h - lipH : y;
      ctx.fillRect(x - 4, lipY, w + 8, lipH);
      ctx.strokeRect(x - 4, lipY, w + 8, lipH);
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
      sky.addColorStop(0, '#0f172a');
      sky.addColorStop(0.6, '#1e293b');
      sky.addColorStop(1, '#0284c7');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H - GROUND_H);

      // Twinkling stars
      stars.forEach(s => {
        const alpha = 0.35 + 0.55 * Math.sin(frames * 0.04 + s.phase);
        ctx.fillStyle = `rgba(248, 250, 252, ${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // City silhouette
      ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
      for (let i = 0; i < 10; i++) {
        const bh = 55 + ((i * 37) % 65);
        ctx.fillRect(i * 44, H - GROUND_H - bh, 42, bh);
      }
    }

    function drawGround() {
      const gy = H - GROUND_H;
      ctx.fillStyle = '#84cc16';
      ctx.fillRect(0, gy, W, 14);

      // Moving stripes
      const offset = state === 'OVER' ? 0 : (frames * PIPE_SPEED) % 28;
      ctx.fillStyle = '#65a30d';
      for (let x = -28; x < W + 28; x += 28) {
        ctx.beginPath();
        ctx.moveTo(x - offset, gy + 2);
        ctx.lineTo(x + 12 - offset, gy + 2);
        ctx.lineTo(x + 4 - offset, gy + 12);
        ctx.lineTo(x - 8 - offset, gy + 12);
        ctx.closePath();
        ctx.fill();
      }

      const dirt = ctx.createLinearGradient(0, gy + 14, 0, H);
      dirt.addColorStop(0, '#d97706');
      dirt.addColorStop(1, '#78350f');
      ctx.fillStyle = dirt;
      ctx.fillRect(0, gy + 14, W, GROUND_H - 14);

      ctx.strokeStyle = '#052e16';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(W, gy);
      ctx.stroke();
    }

    function drawOverlay() {
      if (state === 'PLAY') {
        ctx.font = 'bold 42px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillText(score, W / 2 + 2, 68);
        ctx.fillStyle = '#facc15';
        ctx.fillText(score, W / 2, 65);
        return;
      }

      ctx.fillStyle = 'rgba(9, 13, 22, 0.62)';
      ctx.fillRect(0, 0, W, H - GROUND_H);

      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      const boxW = 320, boxH = 220;
      const bx = (W - boxW) / 2, by = (H - GROUND_H - boxH) / 2;
      ctx.beginPath();
      ctx.roundRect(bx, by, boxW, boxH, 16);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      if (state === 'START') {
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 26px Segoe UI, sans-serif';
        ctx.fillText('FLAPPY CODER 🐦', W / 2, by + 55);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '15px Segoe UI, sans-serif';
        ctx.fillText('Boruların arasından süzülerek', W / 2, by + 95);
        ctx.fillText('en yüksek skoru yap!', W / 2, by + 118);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 17px Consolas, monospace';
        ctx.fillText('▶ BAŞLAMAK İÇİN TIKLA / SPACE', W / 2, by + 172);
      } else if (state === 'OVER') {
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 28px Segoe UI, sans-serif';
        ctx.fillText('OYUN BİTTİ!', W / 2, by + 50);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 18px Consolas, monospace';
        ctx.fillText(`SKORUN: ${score}`, W / 2, by + 95);

        ctx.fillStyle = '#facc15';
        ctx.fillText(`EN İYİ SKOR: ${bestScore}`, W / 2, by + 125);

        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 16px Consolas, monospace';
        ctx.fillText('↻ TEKRAR OYNAMAK İÇİN TIKLA', W / 2, by + 178);
      }
      ctx.restore();
    }

    function handleAction(e) {
      if (e) e.preventDefault();
      if (state === 'START' || state === 'OVER') {
        resetGame();
      } else if (state === 'PLAY') {
        bird.flap();
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        handleAction(e);
      }
    });
    canvas.addEventListener('pointerdown', handleAction);

    function loop() {
      frames++;
      bird.update();
      updatePipes();

      drawBackground();
      pipes.forEach(p => {
        drawPipe(p.x, 0, PIPE_W, p.topH, true);
        const botY = p.topH + PIPE_GAP;
        drawPipe(p.x, botY, PIPE_W, H - GROUND_H - botY, false);
      });

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.04;
        if (pt.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      drawGround();
      bird.draw();
      drawOverlay();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
