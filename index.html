<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>denizkokan0-dot / flappy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;font-family:"Segoe UI",Arial,sans-serif;padding:16px}
.shell{width:100%;max-width:880px;border-radius:14px;overflow:hidden;border:1px solid #30363d;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#161b22}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;color:#8b949e;font-size:12px;font-family:Consolas,monospace}
.bar a{color:#e6edf3;text-decoration:none;font-weight:600}
.bar button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:3px 9px;margin-left:6px;cursor:pointer;font:inherit}
.bar button:hover{border-color:#8b949e}
canvas{display:block;width:100%;aspect-ratio:880/400;cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<div class="shell">
<div class="bar"><a href="https://github.com/denizkokan0-dot" target="_top">denizkokan0-dot / flappy</a><span>SPACE / CLICK flap · P pause</span><span><button id="snd">SOUND: ON</button></span></div>
<canvas id="c"></canvas>
</div>
<script>
const W=880,H=400,GROUND=340,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const R=(a,b)=>a+Math.random()*(b-a);
let best=+localStorage.getItem('flappy_best_v2')||0,sound=true;
// audio
let ac;function tone(f1,f2,d,type='sine',v=.07){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
document.getElementById('snd').onclick=e=>{sound=!sound;e.target.textContent='SOUND: '+(sound?'ON':'OFF')};
// state
let state='idle',score=0,t=0,bird,pipes,parts,clouds,stars,shake=0,groundX=0,hillA=0,hillB=0,medal='',newBest=false;
stars=Array.from({length:60},()=>({x:R(0,W),y:R(0,200),r:R(.5,1.6),p:R(0,6)}));
clouds=Array.from({length:7},()=>({x:R(0,W),y:R(20,170),s:R(.6,1.2),v:R(8,22)}));
function reset(){bird={x:230,y:H/2-30,vy:0,rot:0,flap:0};pipes=[];parts=[];score=0;newBest=false;nextX=720}
let nextX;
function diff(){return Math.min(1,score/40)}
function speed(){return 150+diff()*90}
function gapSize(){return 150-diff()*34}
function addPipe(){const g=gapSize(),m=50,top=R(m,GROUND-m-g);pipes.push({x:nextX,top,gap:g,pass:false,amp:score>12?R(0,28)*Math.min(1,(score-12)/20):0,ph:R(0,6),w:62});nextX+=R(270,320)-diff()*40}
reset();
function flap(){if(state==='idle'){state='run';}if(state==='over'){if(t-overT>.45){reset();state='run'}else return}
if(state==='paused'){state='run';return}
if(state!=='run')return;bird.vy=-400;bird.flap=1;tone(300,520,.09);for(let i=0;i<5;i++)parts.push({x:bird.x-12,y:bird.y+6,vx:R(-90,-20),vy:R(-30,50),l:1,c:'#fff'})}
let overT=0;
function die(){if(state!=='run')return;state='over';overT=t;shake=.35;tone(180,40,.35,'triangle',.14);for(let i=0;i<24;i++)parts.push({x:bird.x,y:bird.y,vx:R(-200,200),vy:R(-260,80),l:1.4,c:Math.random()<.5?'#ffd92e':'#ff7a1a'});
if(score>best){best=score;newBest=true;localStorage.setItem('flappy_best_v2',best)}
medal=score>=40?'💎':score>=25?'🥇':score>=15?'🥈':score>=8?'🥉':''}
function pipeY(p){return p.top+Math.sin(t*1.8+p.ph)*p.amp}
function update(dt){
if(state==='paused')return;
const sp=state==='over'?0:speed();
groundX=(groundX+sp*dt)%40;hillA=(hillA+sp*.12*dt)%W;hillB=(hillB+sp*.3*dt)%W;
clouds.forEach(c=>{c.x-=(c.v+sp*.05)*dt;if(c.x<-80){c.x=W+80;c.y=R(20,170)}});
if(shake>0)shake-=dt;
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.c==='#fff'?0:600)*dt;p.l-=dt*1.6});parts=parts.filter(p=>p.l>0);
if(state==='idle'){bird.y=H/2-30+Math.sin(t*4)*8;bird.rot=0;return}
bird.vy+=1250*dt;bird.y+=bird.vy*dt;bird.flap=Math.max(0,bird.flap-dt*4);
bird.rot+=(Math.max(-.5,Math.min(1.3,bird.vy/520))-bird.rot)*Math.min(1,dt*12);
if(state==='over'){if(bird.y>GROUND-12){bird.y=GROUND-12;bird.vy=0}return}
if(bird.y<12){bird.y=12;bird.vy=0}
if(bird.y>GROUND-12){bird.y=GROUND-12;die();return}
if(!pipes.length||pipes[pipes.length-1].x<W+40)addPipe();
for(const p of pipes){p.x-=sp*dt;const ty=pipeY(p);
if(bird.x+13>p.x&&bird.x-13<p.x+p.w&&(bird.y-10<ty||bird.y+10>ty+p.gap)){die();return}
if(!p.pass&&p.x+p.w<bird.x){p.pass=true;score++;tone(660,990,.12,'square',.04)}}
nextX-=sp*dt;pipes=pipes.filter(p=>p.x>-100)}
// drawing
function mix(a,b,k){return a.map((v,i)=>Math.round(v+(b[i]-v)*k))}
const DAY=[[63,180,232],[189,234,245]],DUSK=[[242,132,92],[255,208,138]],NIGHT=[[10,18,56],[42,59,122]];
function cycle(){const c=((score/10)%4);return c<1?[DAY,DUSK,c]:c<2?[DUSK,NIGHT,c-1]:c<3?[NIGHT,DUSK,c-2]:[DUSK,DAY,c-3]}
function skyCols(){const [a,b,k]=cycle();return[mix(a[0],b[0],k),mix(a[1],b[1],k)]}
function nightness(){const [a,b,k]=cycle();const n=x=>x===NIGHT?1:x===DUSK?.35:0;return n(a)+(n(b)-n(a))*k}
const rgb=a=>`rgb(${a})`;
function hills(off,y,amp,col,per){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,GROUND);for(let x=0;x<=W;x+=8)ctx.lineTo(x,y+Math.sin((x+off)/per*Math.PI*2)*amp+Math.sin((x+off)/per*Math.PI*5)*amp*.3);ctx.lineTo(W,GROUND);ctx.fill()}
function cloud(c){ctx.save();ctx.translate(c.x,c.y);ctx.scale(c.s,c.s);ctx.fillStyle='rgba(255,255,255,.88)';ctx.beginPath();[[0,0,26,12],[-20,5,18,9],[22,5,20,9],[6,-9,16,11]].forEach(e=>{ctx.moveTo(e[0]+e[2],e[1]);ctx.ellipse(e[0],e[1],e[2],e[3],0,0,7)});ctx.fill();ctx.restore()}
function pipeShape(x,y,w,h,capTop){const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#3f7d14');g.addColorStop(.25,'#9be045');g.addColorStop(.6,'#6cb52a');g.addColorStop(1,'#3a7312');ctx.fillStyle=g;ctx.strokeStyle='#27500c';ctx.lineWidth=2.5;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);const cy=capTop?y:y+h-28;ctx.beginPath();ctx.roundRect(x-5,cy,w+10,28,4);ctx.fill();ctx.stroke()}
function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.lineJoin='round';ctx.strokeStyle='#5a3b00';ctx.lineWidth=2.5;
ctx.fillStyle='#f2a900';ctx.beginPath();ctx.moveTo(-14,-2);ctx.lineTo(-24,-6);ctx.lineTo(-22,3);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle='#ffd92e';ctx.beginPath();ctx.ellipse(0,0,16,13,0,0,7);ctx.fill();ctx.stroke();
ctx.fillStyle='#fff3a6';ctx.beginPath();ctx.ellipse(1,6,11,5,0,0,7);ctx.fill();
const wa=state==='run'||state==='idle'?Math.sin(t*(state==='idle'?14:26)+bird.flap*3)*.6-.1:.3;ctx.save();ctx.translate(-5,2);ctx.rotate(wa);ctx.fillStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(1,1,9,5.5,0,0,7);ctx.fill();ctx.stroke();ctx.restore();
ctx.fillStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(7,-5,5.5,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(9,-5,2.4,0,7);ctx.fill();
ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.moveTo(12,1);ctx.quadraticCurveTo(25,-1,26,4);ctx.quadraticCurveTo(24,9,12,8);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function txt(s,x,y,size,col='#fff',al='center'){ctx.font=`800 ${size}px "Segoe UI",Arial,sans-serif`;ctx.textAlign=al;ctx.lineJoin='round';ctx.lineWidth=size/6;ctx.strokeStyle='#1b2a41';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function draw(){
ctx.save();if(shake>0)ctx.translate(R(-1,1)*shake*24,R(-1,1)*shake*24);
const [c1,c2]=skyCols(),g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,rgb(c1));g.addColorStop(1,rgb(c2));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const n=nightness();
if(n>0){stars.forEach(s=>{ctx.globalAlpha=n*(.5+.5*Math.sin(t*2+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});ctx.globalAlpha=n;ctx.fillStyle='#f4f1c9';ctx.beginPath();ctx.arc(760,70,22,0,7);ctx.fill();ctx.fillStyle=rgb(c1);ctx.beginPath();ctx.arc(768,64,19,0,7);ctx.fill();ctx.globalAlpha=1}
clouds.forEach(cloud);
hills(hillA,GROUND-95,38,'rgba(127,183,201,.8)',W);hills(hillB,GROUND-45,24,'#58a860',W/2);
for(const p of pipes){const ty=pipeY(p);pipeShape(p.x,-10,p.w,ty+10,false);pipeShape(p.x,ty+p.gap,p.w,GROUND-ty-p.gap,true)}
// ground
const gr=ctx.createLinearGradient(0,GROUND+16,0,H);gr.addColorStop(0,'#fbe38a');gr.addColorStop(1,'#d9b25a');ctx.fillStyle=gr;ctx.fillRect(0,GROUND,W,H-GROUND);
ctx.fillStyle='#7ccf3a';ctx.fillRect(0,GROUND,W,16);ctx.fillStyle='#62b52a';for(let x=-groundX;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,GROUND+16);ctx.lineTo(x+14,GROUND);ctx.lineTo(x+28,GROUND);ctx.lineTo(x+14,GROUND+16);ctx.fill()}
ctx.fillStyle='#3e8a1a';ctx.fillRect(0,GROUND+13,W,3);ctx.fillStyle='#a37a2c';ctx.fillRect(0,GROUND+16,W,2);
parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.c==='#fff'?2.2:3.2,0,7);ctx.fill()});ctx.globalAlpha=1;
drawBird();
if(n>0){ctx.fillStyle=`rgba(5,10,34,${n*.28})`;ctx.fillRect(0,0,W,H)}
if(state!=='idle')txt(score,W/2,70,52);
txt('BEST '+best,W-18,34,18,'#fff','right');
if(state==='idle'||state==='paused'||state==='over'){ctx.fillStyle='rgba(13,17,23,.45)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(22,27,34,.92)';ctx.strokeStyle='#30363d';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W/2-170,H/2-92,340,170,14);ctx.fill();ctx.stroke();
if(state==='idle'){txt('FLAPPY',W/2,H/2-42,40,'#ffd92e');txt('endless mode',W/2,H/2-12,16,'#8b949e');txt('Press SPACE or click',W/2,H/2+34,18);txt('to start',W/2,H/2+58,16,'#8b949e')}
else if(state==='paused'){txt('PAUSED',W/2,H/2-8,38);txt('Press P or click',W/2,H/2+34,16,'#8b949e')}
else{txt('GAME OVER',W/2,H/2-44,34,'#f85149');txt(`SCORE ${score}   ${medal}`,W/2,H/2-6,22);txt(newBest?'★ NEW BEST!':'BEST '+best,W/2,H/2+22,18,newBest?'#ffd92e':'#8b949e');txt('Click / SPACE to retry',W/2,H/2+56,16,'#c9d1d9')}}
ctx.restore()}
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;t+=dt;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();flap()}else if(e.code==='KeyP'||e.code==='Escape'){if(state==='run')state='paused';else if(state==='paused')state='run'}else if(e.code==='KeyM')document.getElementById('snd').click()});
</script>
</body>
</html>
